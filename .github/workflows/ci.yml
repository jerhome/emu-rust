name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Icon source fingerprint
        # Generated icons are committed; only the SVG fingerprint is compared (run scripts/gen-icons.sh).
        run: cd packaging/icon && sha256sum --check --strict SOURCE.sha256

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            xvfb libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check workspace version against the roadmap
        run: scripts/check-version-vs-roadmap.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        # xvfb: some tests open an X display; the mock core is built with the system C compiler (ADR 0009).
        run: xvfb-run -a cargo test --locked --workspace --no-fail-fast

      - name: Build without default features
        # Guards the build without gilrs (the `gamepad` feature is on by default in emu-app, ADR 0016).
        run: cargo build --locked --workspace --no-default-features

      - name: Build release
        run: cargo build --locked --release -p emu-app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-rust-linux-x86_64
          path: target/release/emu-rust
          if-no-files-found: error
          retention-days: 14

  macos-intel:
    name: macOS Intel (x86_64-apple-darwin)
    # macos-13 was retired by GitHub (Dec 2025); macos-15-intel is the remaining x86_64 runner.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      # rustc and the `cc`-built C shim (ADR 0009) target 10.13 (Info.plist LSMinimumSystemVersion); test Mac: 12.7.6.
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target x86_64-apple-darwin -- -D warnings

      - name: Test
        # Mock-core tests are `cfg(target_os = "linux")` and compile out here until the helper supports .dylib.
        run: cargo test --locked --workspace --no-fail-fast --target x86_64-apple-darwin

      - name: Build without default features
        run: cargo build --locked --workspace --no-default-features --target x86_64-apple-darwin

      - name: Build release
        run: cargo build --locked --release -p emu-app --target x86_64-apple-darwin

      - name: Minimum macOS version (<= 12.0)
        run: scripts/check-macos-minos.sh target/x86_64-apple-darwin/release/emu-rust 12.0

      # Bare binary for CI; the .app bundle is built by release.yml (scripts/package-macos.sh).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-rust-macos-x86_64
          path: target/x86_64-apple-darwin/release/emu-rust
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --features emu-app/cli-bin --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test
        # Mock-core tests stay `cfg(unix)` until the helper can build a .dll (ADR 0012).
        run: cargo test --locked --workspace --no-fail-fast --target x86_64-pc-windows-msvc

      - name: Build without default features
        run: cargo build --locked --workspace --no-default-features --target x86_64-pc-windows-msvc

      - name: Build release
        # MSVC toolchain; emu-rust.exe (GUI subsystem) + emu-rust-cli.exe (console), ADR 0023 §3.
        run: cargo build --locked --release -p emu-app --features cli-bin --target x86_64-pc-windows-msvc

      - name: Workspace version
        id: ver
        shell: bash
        run: echo "version=$(scripts/workspace-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (emu-rust-cli.exe)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $out = & target/x86_64-pc-windows-msvc/release/emu-rust-cli.exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "emu-rust-cli.exe --version exited with $LASTEXITCODE"; exit 1 }
          Write-Output $out
          if (-not (($out | Out-String) -match [regex]::Escape($env:VERSION))) { Write-Error "version mismatch"; exit 1 }
          # An unknown argument must give a usage error (code 2), seen by PowerShell because the exe is a console one.
          # GitHub runs pwsh with $ErrorActionPreference = 'stop' and ends the script with exit $LASTEXITCODE:
          # the expected stderr and exit code 2 must not fail the step.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & target/x86_64-pc-windows-msvc/release/emu-rust-cli.exe --no-such-option 2>$null
          $code = $LASTEXITCODE
          if ($code -ne 2) { Write-Error "unknown argument: expected exit code 2, got $code"; exit 1 }
          $global:LASTEXITCODE = 0
          exit 0

      - name: PE subsystems (GUI = 2, console = 3)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Subsystem([string]$path) {
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ([BitConverter]::ToUInt32($b, $pe) -ne 0x00004550) { throw "${path}: no PE signature" }
            # Optional header starts 24 bytes after the PE signature; Subsystem is at offset 68 (PE32 and PE32+).
            [int][BitConverter]::ToUInt16($b, $pe + 24 + 68)
          }
          $dir = 'target/x86_64-pc-windows-msvc/release'
          $gui = Get-Subsystem "$dir/emu-rust.exe"
          $cui = Get-Subsystem "$dir/emu-rust-cli.exe"
          Write-Output "emu-rust.exe subsystem=$gui, emu-rust-cli.exe subsystem=$cui"
          if ($gui -ne 2) { throw "emu-rust.exe must use the GUI subsystem (2), got $gui" }
          if ($cui -ne 3) { throw "emu-rust-cli.exe must use the console subsystem (3), got $cui" }

      - name: Windows resources (name and version in both executables)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'target/x86_64-pc-windows-msvc/release'
          # winresource derives the version from the package; compare the numeric core (7.1.0 for 7.1.0-rc.1).
          $core = ($env:VERSION -split '[-+]')[0]
          foreach ($exe in 'emu-rust.exe', 'emu-rust-cli.exe') {
            $vi = (Get-Item "$dir/$exe").VersionInfo
            Write-Output "$exe ProductName='$($vi.ProductName)' ProductVersion='$($vi.ProductVersion)' FileVersion='$($vi.FileVersion)'"
            if ([string]::IsNullOrWhiteSpace($vi.ProductName)) { throw "$exe has no version resource (ProductName empty)" }
            if (-not ([string]$vi.ProductVersion).StartsWith($core)) { throw "$exe ProductVersion '$($vi.ProductVersion)' does not match workspace version $env:VERSION" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-rust-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/emu-rust.exe
            target/x86_64-pc-windows-msvc/release/emu-rust-cli.exe
          if-no-files-found: error
          retention-days: 14
