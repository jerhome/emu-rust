# Run from the repository root:
#   docker compose -f docker/compose.yaml up --build emu-wslg    # Windows + WSL2 (WSLg)
#   docker compose -f docker/compose.yaml up --build emu-x11     # Linux host with X11
#   docker compose -f docker/compose.yaml up --build emu-novnc   # any host, browser at http://localhost:6080/vnc.html
# Published image instead of a local build (ADR 0012):
#   EMU_IMAGE=ghcr.io/jerhome/emu-rust:0.1.0 docker compose -f docker/compose.yaml up --no-build emu-wslg
name: emu-rust

x-base: &base
  # Default: local build tag. Set EMU_IMAGE to a ghcr.io tag and pass --no-build (or `pull`) to skip the build.
  image: ${EMU_IMAGE:-emu-rust:dev}
  build:
    context: ..
    dockerfile: docker/runtime/Dockerfile
  # One volume holds everything persistent: saves/ states/ assets/ config.toml (ADR 0011).
  # EMU_DATA_DIR=/data is set in the image and repeated in each service (a YAML merge does not merge maps).
  volumes:
    - emu-data:/data

services:
  emu-wslg:
    <<: *base
    profiles: ["wslg"]
    devices:
      - /dev/dxg
      # Gamepads (ADR 0016): WSLg does not expose USB pads to WSL2 by default. Attach one with usbipd-win
      # (Windows: `usbipd attach --wsl --busid <id>`), check that /dev/input/js* or event* exists in WSL,
      # then uncomment the line below (compose fails if the path is missing, hence commented out).
      # The container user (uid 1000) needs read access to /dev/input/event*: add `group_add: ["input"]`
      # (use the numeric host gid of `input`: `getent group input`) or relax the device permissions.
      # - /dev/input:/dev/input
    volumes:
      - emu-data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl
    environment:
      EMU_DATA_DIR: "/data"
      DISPLAY: ":0"
      WAYLAND_DISPLAY: "wayland-0"
      XDG_RUNTIME_DIR: "/mnt/wslg/runtime-dir"
      PULSE_SERVER: "unix:/mnt/wslg/PulseServer"
      # GPU acceleration through Mesa's d3d12 driver.
      LD_LIBRARY_PATH: "/usr/lib/wsl/lib"

  emu-x11:
    <<: *base
    profiles: ["x11"]
    volumes:
      - emu-data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/pulse/native
    devices:
      - /dev/dri
      # Gamepads on a Linux host (ADR 0016): uncomment, and give uid 1000 read access to /dev/input/event*
      # (e.g. `group_add: ["<numeric gid of the host group input>"]`).
      # - /dev/input:/dev/input
    environment:
      EMU_DATA_DIR: "/data"
      DISPLAY: "${DISPLAY:-:0}"
      PULSE_SERVER: "unix:/run/pulse/native"

  emu-novnc:
    <<: *base
    profiles: ["novnc"]
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      EMU_DATA_DIR: "/data"
      EMU_DISPLAY: "novnc"

volumes:
  emu-data:
