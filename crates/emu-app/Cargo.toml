[package]
name = "emu-app"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false
# `cargo run -p emu-app` keeps launching the application (two binaries with `cli-bin`).
default-run = "emu-rust"

# ADR 0023 §3: the program is the library (`emu_app::run`); the binaries are a few lines each.
[lib]
path = "src/lib.rs"

# Windows: graphical subsystem (no terminal on double-click). Elsewhere: the only binary, console as before.
[[bin]]
name = "emu-rust"
path = "src/main.rs"

# Windows command line (console subsystem): same program, built only with `cli-bin` (Windows packages, CI).
[[bin]]
name = "emu-rust-cli"
path = "src/bin/emu-rust-cli.rs"
required-features = ["cli-bin"]

[features]
default = ["audio-cpal", "gamepad"]
audio-cpal = ["emu-ui/audio-cpal"]
# Real pads through gilrs (ADR 0016). Linux builds need libudev-dev (runtime: libudev1);
# `--no-default-features --features audio-cpal` builds without it.
gamepad = ["emu-ui/gamepad"]
# Builds `emu-rust-cli` (Windows packages and CI; ADR 0023 §3).
cli-bin = []

[dependencies]
# SIGINT / SIGTERM / SIGHUP (and console events on Windows) end the game cleanly: saves written.
ctrlc = { version = "3.5", features = ["termination"] }
directories = { workspace = true }
emu-ui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Icon and version resource of the Windows executables (build.rs). Host cfg: a cross-compilation from Linux
# builds without the resource. MIT.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
