# Commodore 64 keyboard for the frontend's virtual keyboard (same format as atari_st.toml; design v5.0 §7).
# `key` = libretro key name as read by VICE; legends are the C64 ones (the C64 has no per-language layout).
# RESTORE = Page Up, RUN/STOP = Escape, C= = Left Ctrl, CTRL = Tab, pound = End, left arrow = backquote.
id = "c64"
name = "Commodore 64"

[[row]]
keys = [
  { key = "backquote", label = "←" },
  { key = "1", label = "1" }, { key = "2", label = "2" }, { key = "3", label = "3" }, { key = "4", label = "4" },
  { key = "5", label = "5" }, { key = "6", label = "6" }, { key = "7", label = "7" }, { key = "8", label = "8" },
  { key = "9", label = "9" }, { key = "0", label = "0" }, { key = "plus", label = "+" }, { key = "minus", label = "-" },
  { key = "end", label = "£" }, { key = "home", label = "CLR/HOME" }, { key = "backspace", label = "INST/DEL" },
  { key = "f1", label = "f1", gap = 0.5 },
]

[[row]]
keys = [
  { key = "tab", label = "CTRL", width = 1.5, sticky = true },
  { key = "q", label = "Q" }, { key = "w", label = "W" }, { key = "e", label = "E" }, { key = "r", label = "R" },
  { key = "t", label = "T" }, { key = "y", label = "Y" }, { key = "u", label = "U" }, { key = "i", label = "I" },
  { key = "o", label = "O" }, { key = "p", label = "P" }, { key = "at", label = "@" },
  { key = "asterisk", label = "*" }, { key = "caret", label = "↑" },
  { key = "pageup", label = "RESTORE", width = 1.5 },
  { key = "f3", label = "f3", gap = 0.5 },
]

[[row]]
keys = [
  { key = "escape", label = "RUN/STOP", width = 1.5 },
  { key = "capslock", label = "SHIFT LOCK" },
  { key = "a", label = "A" }, { key = "s", label = "S" }, { key = "d", label = "D" }, { key = "f", label = "F" },
  { key = "g", label = "G" }, { key = "h", label = "H" }, { key = "j", label = "J" }, { key = "k", label = "K" },
  { key = "l", label = "L" }, { key = "colon", label = ":" }, { key = "semicolon", label = ";" },
  { key = "equals", label = "=" }, { key = "return", label = "RETURN", width = 1.5 },
  { key = "f5", label = "f5", gap = 0.5 },
]

[[row]]
keys = [
  { key = "lctrl", label = "C=", width = 1.5, sticky = true },
  { key = "lshift", label = "SHIFT", width = 1.25, sticky = true },
  { key = "z", label = "Z" }, { key = "x", label = "X" }, { key = "c", label = "C" }, { key = "v", label = "V" },
  { key = "b", label = "B" }, { key = "n", label = "N" }, { key = "m", label = "M" }, { key = "comma", label = "," },
  { key = "period", label = "." }, { key = "slash", label = "/" },
  { key = "rshift", label = "SHIFT", width = 1.75, sticky = true },
  { key = "up", label = "^", gap = 0.5 }, { key = "down", label = "v" },
  { key = "f7", label = "f7", gap = 0.5 },
]

[[row]]
keys = [
  { key = "space", label = "", width = 8.0, gap = 3.0 },
  { key = "left", label = "<-", gap = 3.0 }, { key = "right", label = "->" },
]

# Physical key (winit `KeyCode` name) → libretro key: AltGr = RESTORE, the ISO `<` key = pound (VICE reads End).
# Identical on the three OSes. Must stay the last table of the file.
[remap]
AltRight = "pageup"
IntlBackslash = "end"
