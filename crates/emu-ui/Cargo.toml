[package]
name = "emu-ui"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
default = ["audio-cpal"]
audio-cpal = ["emu-runtime/audio-cpal"]

[dependencies]
egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
emu-assets = { workspace = true }
emu-library = { workspace = true }
emu-runtime = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
