[package]
name = "emu-ui"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
default = ["audio-cpal"]
audio-cpal = ["emu-runtime/audio-cpal"]
# Real pads through gilrs (ADR 0016). Off here; emu-app enables it. Linux build needs libudev-dev.
gamepad = ["dep:gilrs"]

[dependencies]
egui = { workspace = true }
egui-winit = { workspace = true }
egui_glow = { workspace = true }
emu-assets = { workspace = true }
emu-library = { workspace = true }
emu-runtime = { workspace = true }
gilrs = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true, features = ["serde"] }
sys-locale = "0.3"
# Native file dialog (MIT): on Linux the xdg-desktop-portal through libdbus loaded at run time (zenity fallback),
# no OpenSSL, nothing linked at build time. Docker uses the built-in egui browser instead.
rfd = "0.18"
# Opens the ROM folder in the system file manager (MIT OR Apache-2.0); never goes through a shell.
opener = { version = "0.9", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
