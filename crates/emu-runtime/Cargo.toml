[package]
name = "emu-runtime"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Real audio output (cpal; on Linux the build needs libasound2-dev + pkg-config for alsa-sys).
# `--no-default-features` builds a silent binary where ALSA headers are unavailable.
default = ["audio-cpal"]
audio-cpal = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
crc32fast = "1.5"
emu-libretro = { workspace = true }
glow = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
png = { workspace = true }
rtrb = { workspace = true }
# Folder snapshot manifest (design v4.0 §3.2); same version as emu-assets.
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true }
zip = { workspace = true }

# ADR 0023 §3: `MessageBoxW` (`dialog::fatal_dialog`) and `GetErrorMode` / `SetErrorMode`
# (`dry_run::suppress_crash_dialogs`) are the only Windows calls. 0.61.2 is already in Cargo.lock
# (no other version may be added). MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
