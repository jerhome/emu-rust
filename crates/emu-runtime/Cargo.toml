[package]
name = "emu-runtime"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Real audio output (cpal; on Linux the build needs libasound2-dev + pkg-config for alsa-sys).
# `--no-default-features` builds a silent binary where ALSA headers are unavailable.
default = ["audio-cpal"]
audio-cpal = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
crc32fast = "1.5"
emu-libretro = { workspace = true }
glow = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
png = { workspace = true }
rtrb = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
