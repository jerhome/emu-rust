# Table "libretro database name -> emu-rust id and tier" (ADR 0025 section 3, design 8.0 section 2.1).
# The id of a machine is the name of its folder roms/<id>/: DEFINITIVE. Entries are only ever ADDED, never renamed.
# Injective (one id per name, one name per id); the 17 official systems carry their own id. An id of this table is
# reserved to its own database. Entries added after 8.0 take the reduction of their name (lower-case ASCII letters
# and digits of the part after the manufacturer, 24 characters) without suffix; the reduction collisions among the
# names below are settled here, once.
# tier: cartridge | disc | computer | arcade (palier of ADR 0025 section 9).
# PROVISIONAL CONTENT: rebuilt without network access from the names of libretro-database; lot PC1 (architect)
# aligns it with the real set of core-info database fields before the tag.

