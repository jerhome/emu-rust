[package]
name = "emu-library"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

# ADR 0014. Versions pinned here (not in [workspace.dependencies]) to keep task L1 inside this crate.
[dependencies]
crc32fast = "1.5"
# SQLite compiled from source (`bundled`): no system library; SQLite is public domain, rusqlite MIT.
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { workspace = true }
sha1 = "0.10"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

# `O_NONBLOCK` for opening ROMs (a FIFO swapped in after the walk must not hang the scan). Already in the lock file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
