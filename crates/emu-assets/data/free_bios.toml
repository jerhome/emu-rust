# Free BIOS catalogue (ADR 0005, ADR 0015 §2) and free SoundFont (ADR 0018 §5). Only free software: never a
# commercial TOS / Kickstart / MT-32 ROM. `kind` = "bios" (default) or "soundfont" (own size limits);
# `[[bios.archive]] format` = "zip" (default) or "raw" (the file is the variant).
# Every archive and every image is pinned (size + SHA-256; md5 for `check_firmware`). No TOFU: a new EmuTOS
# release means a new version of this file, reviewed by `reviewer`.
# Values measured on 2026-11-20 from the SourceForge archives (they match docs/design/v2.0-atari-st.md §3.3).
#
# Default variant: 192 KB French (user decision, ADR 0015 header). Callers first try the variant matching
# the system language (`FreeBios::preferred_variant`), then fall back to `default_variant`.

