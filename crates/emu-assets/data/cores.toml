# Core preferences per system (ADR 0013). Keys: libretro database names (as in `.info` `database` fields and
# libretro-thumbnails). First core = recommended; users override with `[cores.preferred]` in config.toml.
# Licences checked against the buildbot `.info` files on 2026-11-19.

[systems."Sega - Mega Drive - Genesis"]
cores = ["genesis_plus_gx", "picodrive"]          # Non-commercial, MAME licence (non-commercial)

[systems."Sega - Master System - Mark III"]
cores = ["genesis_plus_gx", "picodrive"]

[systems."Sega - Game Gear"]
cores = ["genesis_plus_gx", "picodrive"]

[systems."Nintendo - Super Nintendo Entertainment System"]
cores = ["snes9x", "bsnes", "mesen-s"]            # Non-commercial, GPLv3, GPLv3

[systems."Nintendo - Game Boy"]
cores = ["gambatte", "sameboy", "mgba"]           # GPLv2, MIT, MPL-2.0

[systems."Nintendo - Game Boy Color"]
cores = ["gambatte", "sameboy", "mgba"]

[systems."Nintendo - Nintendo Entertainment System"]
cores = ["mesen", "nestopia", "fceumm"]           # GPLv3, GPLv2, GPLv2

[systems."Atari - ST"]
cores = ["hatari", "hatarib"]                     # GPLv2, GPLv2 (ADR 0015 §1)

[systems."Sega - Mega-CD - Sega CD"]
cores = ["genesis_plus_gx", "picodrive"]          # Non-commercial, MAME (non-commercial)

[systems."Commodore - Amiga"]
cores = ["puae", "puae2021"]                      # GPLv2, GPLv2 (ADR 0017 §1); same order on every OS

# Per-core frontend properties (ADR 0015 §1, optional table):
# - media: "direct" (content paths handed over as is) or "working_copy" (the core writes into disk images:
#   a copy under <data>/saves/<core_id>/ is handed over instead, the user's files are never modified).
#   Default "direct".
# - options: frontend defaults, applied over the core's own defaults and under the user's settings.
# 3.0 keys (design docs/design/v3.0-amiga.md §3.3 and §3.5):
# - media_direct: lower-case extensions handed over in place, never copied nor extracted (§3.5.1).
# - game_saves: file-name patterns of the save files the core writes in saves/<core_id>/ (`{game}` = content
#   name, at most one `*`, no separator), deleted by « Réinitialiser » (§3.5.3).
# - builtin_firmware: ROMs compiled into the core (ADR 0005, 2026-11-21 amendment, « Builtin » rule): nothing
#   expected in system/, nothing downloaded; `notice` is shown in the Cores screen and the release README.
# - required_firmware."<system>": single pre-launch check (§3.5.5). `variant` = "model" | "region";
#   `files` = variant -> file name in system/; `default` = key used for an unknown variant; `fallback` = core
#   option that selects the ROM built into the core when the file is missing (requires builtin_firmware).
# - recommended_on: ["linux" | "windows" | "macos"]: label shown next to this alternative in the core
#   selector; the default order above never changes.
[cores.hatari]
media = "working_copy"                            # writes into the floppy images by default
options = { hatari_vkbd = "disabled" }            # the frontend's virtual keyboard replaces it (pad X button)

[cores.hatarib]
media = "direct"                                  # writes modified floppies to saves/, never the original

[cores.genesis_plus_gx]
options = { genesis_plus_gx_system_bram = "per game" }   # Mega CD only: one internal backup RAM file per game

[cores.puae]
media = "working_copy"                            # writes into the floppy images (puae_floppy_write_redirect off)
media_direct = ["ipf", "lha"]                     # IPF read-only (capsimg), WHDLoad archives never written
game_saves = ["{game}.save*.adf"]                 # #SAVEDISK: floppies created by the core
builtin_firmware = { label = "AROS (intégré au core)", notice = "AROS — AROS Public License 1.1, fourni par le core puae." }
options = { puae_mapper_select = "---", puae_mapper_mouse_toggle = "---", puae_physicalmouse = "enabled", puae_floppy_write_redirect = "disabled" }

[cores.puae.required_firmware."Commodore - Amiga"]
variant = "model"                                 # resolved puae_model (ADR 0017 §2)
default = "A500"
fallback = { option = "puae_kickstart", value = "aros" }

# Kickstart expected per puae model preset (README of the core, ADR 0017 §Contexte).
[cores.puae.required_firmware."Commodore - Amiga".files]
A500OG = "kick34005.A500"
A500 = "kick34005.A500"
A500ECS = "kick34005.A500"
A2000OG = "kick34005.A500"
A500PLUS = "kick37175.A500"
A600OG = "kick40063.A600"
A600 = "kick40063.A600"
A2000 = "kick40063.A600"
A1200OG = "kick40068.A1200"
A1200 = "kick40068.A1200"
A4030 = "kick40068.A4000"
A4040 = "kick40068.A4000"

[cores.puae2021]
media = "working_copy"                            # writes into the floppy images (puae_floppy_write_redirect off)
media_direct = ["ipf", "lha"]                     # IPF read-only (capsimg), WHDLoad archives never written
game_saves = ["{game}.save*.adf"]                 # #SAVEDISK: floppies created by the core
builtin_firmware = { label = "AROS (intégré au core)", notice = "AROS — AROS Public License 1.1, fourni par le core puae2021." }
recommended_on = ["macos"]                        # user decision of 2026-11-21: « recommandé sur Mac »
options = { puae_mapper_select = "---", puae_mapper_mouse_toggle = "---", puae_physicalmouse = "enabled", puae_floppy_write_redirect = "disabled" }

[cores.puae2021.required_firmware."Commodore - Amiga"]
variant = "model"                                 # resolved puae_model (ADR 0017 §2)
default = "A500"
fallback = { option = "puae_kickstart", value = "aros" }

# Kickstart expected per puae model preset (README of the core, ADR 0017 §Contexte).
[cores.puae2021.required_firmware."Commodore - Amiga".files]
A500OG = "kick34005.A500"
A500 = "kick34005.A500"
A500ECS = "kick34005.A500"
A2000OG = "kick34005.A500"
A500PLUS = "kick37175.A500"
A600OG = "kick40063.A600"
A600 = "kick40063.A600"
A2000 = "kick40063.A600"
A1200OG = "kick40068.A1200"
A1200 = "kick40068.A1200"
A4030 = "kick40068.A4000"
A4040 = "kick40068.A4000"

# PC-DOS (ADR 0018 §1): dosbox_pure only. dosbox_core and dosbox_svn are not offered (no zip, no savestates,
# they write into game folders); they stay usable with `--core <path>`.
[systems."DOS"]
cores = ["dosbox_pure"]                           # GPLv2

# 4.0 keys (design docs/design/v4.0-dos.md §3.3):
# - folders: "snapshot" = an unpacked game folder reaches the core as a stored-zip snapshot (folder never
#   written); absent = folders refused for the core.
# - vfs: the frontend answers GET_VFS_INTERFACE (v3) for this core. Default false.
# - analog: sticks passed as RETRO_DEVICE_ANALOG, no stick -> D-pad conversion (ADR 0016 amended). Default false.
# - system_caches: plain file names the core writes at the root of system/, deleted after an install / import
#   there (they would list stale files).
# - layout_option: core option computed from the system language (exact tag, then language without region,
#   else `fallback`); a user setting always wins.
# - featured_options."<system>": option keys shown first (« Réglages DOS »), in this order.
[cores.dosbox_pure]
media = "working_copy"                            # img / ima / vhd / jrc: written in place by the core
media_direct = ["zip", "dosz", "iso", "cue", "chd", "ins"]   # never copied nor extracted (the core reads zips)
folders = "snapshot"
vfs = true                                        # lists system/ (SoundFonts, MT-32 ROMs) through the VFS
game_saves = ["{game}.pure.zip", "{game}-*.sav"]  # changes of the C: drive, save states of the core
system_caches = ["DOSBoxPureMidiCache.txt"]
analog = true
layout_option = { option = "dosbox_pure_keyboard_layout", fallback = "us", map = { fr = "fr", "fr-BE" = "be", de = "gr", "en-GB" = "uk", es = "sp", it = "it", "de-CH" = "sg", "fr-CH" = "sf" } }
options = { dosbox_pure_midi = "disabled" }       # MIDI only once a SoundFont / MT-32 is chosen

[cores.dosbox_pure.featured_options]
"DOS" = ["dosbox_pure_cycles", "dosbox_pure_memory_size", "dosbox_pure_cpu_type", "dosbox_pure_machine", "dosbox_pure_sblaster_type", "dosbox_pure_midi", "dosbox_pure_keyboard_layout", "dosbox_pure_mouse_speed_factor"]
