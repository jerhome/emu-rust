# Advice only (v7.1 point 5): which user-provided files make a core work better, or are required. No hash and
# no URL: nothing is ever downloaded (ADR 0005); the user imports the files into the system directory.
# Names are relative to the system directory, as in the cores' `.info` files.
# `system` is the emu-library system id (`systems.toml`); an entry applies only to that core on that system.

[cores.mgba]
system = "gba"
note = "Works without it (built-in BIOS), but a real GBA BIOS improves compatibility."
files = [{ name = "gba_bios.bin", required = false }]

[cores.pcsx_rearmed]
system = "psx"
note = "Works without it (HLE BIOS), but a real PlayStation BIOS improves compatibility."
files = [{ name = "scph5501.bin", required = false }]

[cores.swanstation]
system = "psx"
note = "A PlayStation BIOS is required for most games."
files = [{ name = "scph5501.bin", required = true }]

[cores.mednafen_psx_hw]
system = "psx"
note = "A PlayStation BIOS is required."
files = [{ name = "scph5501.bin", required = true }]

[cores.opera]
system = "3do"
note = "A 3DO BIOS is required."
files = [{ name = "panafz10.bin", required = true }]

[cores.genesis_plus_gx]
system = "megacd"
note = "Sega CD games need a Mega CD BIOS."
files = [{ name = "bios_CD_E.bin", required = true }, { name = "bios_CD_U.bin", required = true }, { name = "bios_CD_J.bin", required = true }]

[cores.picodrive]
system = "megacd"
note = "Sega CD games need a Mega CD BIOS."
files = [{ name = "bios_CD_E.bin", required = true }, { name = "bios_CD_U.bin", required = true }, { name = "bios_CD_J.bin", required = true }]

[cores.puae]
system = "amiga"
note = "Works without it (built-in AROS), but an original Kickstart improves compatibility."
files = [{ name = "kick34005.A500", required = false }, { name = "kick40068.A1200", required = false }]
