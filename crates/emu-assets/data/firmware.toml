# Reference md5 of firmware (BIOS) files, for files whose `.info` gives no hash (ADR 0013 §8) and for the BIOS
# import (ADR 0017 §3). Hashes only: nothing is ever downloaded (ADR 0005); users provide the files in `system/`.
# Source: libretro-database `dat/System.dat` (v1.19.0, commit 2a8de0276fd7d3095f2501c3de3799a14c37e910,
# 2026-10-24; file SHA-256 8d66d507fae3b4e005abed2e19c221e249fe4297ae40425947b363c8610e73b3), sections listed
# below; nothing else (md5 found only in a core's `.info` or README are read from the installed `.info` at run
# time, never copied here: design v3.0 §3.5.6). Keys: path relative to the system directory, as in `.info` files.
# License: libretro-database is licensed CC-BY-SA-4.0 (LICENSE at the commit above,
# https://github.com/libretro/libretro-database). The entries below are derived from it and are distributed under
# the same license, with attribution to the libretro-database contributors.
# Entry forms: `"name" = ["md5", …]` (several md5 = regional variants) or `"name" = { md5 = "…" | ["…", …],
# size = <bytes> }` (`size` optional: quick reject at import and display; the md5 stays the only verification).
# Sections added in 3.0 (one pass for 3.0 to 6.0, inert until a core asks for them): Atari - ST, Commodore -
# Amiga, Commodore - C128 (JiffyDOS files only), DOS (MT-32 / CM-32L ROMs only, not the BASS libraries);
# Sega - Mega CD - Sega CD gained its sizes. Sections added in 7.0 (ADR 0021): « Sony - PlayStation » and
# « 3DO Company, The - 3DO » (exact section name in `System.dat`, not the database name of cores.toml); whole
# sections, none of these files is ever required (cores fall back to their built-in BIOS).

