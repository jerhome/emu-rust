<?xml version="1.0" encoding="UTF-8"?>
<!-- emu-rust icon, variant C « Écran » : a screen showing a pixel-stepped play triangle, on its stand. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#1b1b1f"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3a3a44" stroke-width="8"/>
  <!-- screen -->
  <rect x="84" y="104" width="344" height="256" rx="36" fill="#96c8ff"/>
  <rect x="112" y="132" width="288" height="200" rx="14" fill="#16233a"/>
  <!-- pixel play triangle: 5 rows of 24 px blocks -->
  <rect x="208" y="172" width="24" height="120" fill="#ffbe50"/>
  <rect x="232" y="184" width="24" height="96" fill="#ffbe50"/>
  <rect x="256" y="196" width="24" height="72" fill="#ffbe50"/>
  <rect x="280" y="208" width="24" height="48" fill="#ffbe50"/>
  <rect x="304" y="220" width="24" height="24" fill="#ffbe50"/>
  <!-- stand -->
  <rect x="232" y="360" width="48" height="32" fill="#285aa0"/>
  <rect x="168" y="392" width="176" height="28" rx="14" fill="#285aa0"/>
</svg>
